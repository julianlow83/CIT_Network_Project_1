<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CYBERDYNE SYSTEMS // INITIATING PURSUIT PROTOCOL...</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Embedded styling overrides for standalone loader layout */
        :root {
            --bg-color: #050508;
            --primary-red: #ff1a1a;
            --dim-red: #8b0000;
            --text-glow: 0 0 8px rgba(255, 26, 26, 0.6);
            --font-stack: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary-red);
            font-family: var(--font-stack);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Tactical grid overlay */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                linear-gradient(rgba(255, 26, 26, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 26, 26, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
        }

        /* CRT Scanline overlay */
        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(
                rgba(0, 0, 0, 0) 50%, 
                rgba(0, 0, 0, 0.35) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        /* Main Loader Container */
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
            text-align: center;
            padding: 20px;
        }

        /* Frame for central media file */
        .gif-frame {
            max-width: 480px;
            width: 90vw;
            border: 1px solid var(--dim-red);
            box-shadow: 0 0 20px rgba(255, 26, 26, 0.25);
            background: #000;
            padding: 12px;
            margin-bottom: 25px;
        }

        .gif-frame img, .gif-frame video {
            width: 100%;
            height: auto;
            display: block;
        }

        /* HUD Status Text */
        .status-text {
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-shadow: var(--text-glow);
            margin-bottom: 15px;
        }

        /* 3-Second Progress Bar Container */
        .progress-bar-container {
            width: 280px;
            height: 10px;
            border: 1px solid var(--primary-red);
            background: rgba(0, 0, 0, 0.6);
            padding: 2px;
            position: relative;
        }

        /* Animated Progress Fill set to 3s */
        .progress-bar-fill {
            height: 100%;
            background: var(--primary-red);
            box-shadow: 0 0 8px var(--primary-red);
            width: 0%;
            animation: fillProgress 3s linear forwards;
        }

        /* Direct Skip Link */
        .skip-link {
            margin-top: 20px;
            font-size: 0.75rem;
            color: var(--dim-red);
            text-decoration: none;
            letter-spacing: 1px;
            transition: color 0.2s ease;
        }

        .skip-link:hover {
            color: var(--primary-red);
        }

        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="loader-container">
        <div class="gif-frame">
            <img src="img/riding_shotgun.gif" alt="T-800 bike chase sequence">
        </div>

        <div class="status-text">> ENGAGING HIGHWAY PURSUIT PROTOCOL...</div>

        <div class="progress-bar-container">
            <div class="progress-bar-fill"></div>
        </div>

        <a href="main.html" class="skip-link">[ BYPASS SEQUENCE // MANUAL OVERRIDE ]</a>
    </div>

</body>
</html>
